<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>质量知识竞赛</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="stylesheet" href="css/scoreboard.css">
  <link rel="stylesheet" href="css/buttons.css">
</head>

<body>

  <!-- 顶部导航 -->
  <header class="topbar">

    <h1>质量知识竞赛</h1>

    <nav>
      <button onclick="switchMode('home')">
        首页
      </button>

      <button onclick="switchMode('answer'); startQuestion();">
        必答题
      </button>

      <button onclick="switchMode('buzzer'); startQuestion();">
        抢答题
      </button>

      <button onclick="switchMode('risk'); startQuestion();">
        风险题
      </button>

      <button onclick="switchMode('bonus'); startBonus()" ;>
        加赛题
      </button>

      <button id="fullscreen-btn">
        全屏
      </button>
    </nav>

  </header>

  <!-- 主布局 -->
  <main class="main-layout">

    <!-- 内容区域 -->
    <section class="content-area">

      <!-- 首页 -->
      <div id="home-page" class="page active">

        <div class="home-center">

          <div class="home-title">
            大连计量检验检测研究院有限公司2026年度“质量日”活动
          </div>

          <div class="home-subtitle">
            质量知识竞赛
          </div>

        </div>

      </div>

      <!-- 答题页面 -->
      <div id="question-page" class="page">

        <!-- 模式标题 -->
        <div class="mode-title" id="mode-title">
          必答题
        </div>

        <!-- 题卡 -->
        <div class="question-card">

          <!-- 开始答题 -->
          <div id="start-container">

            <div id="bonus-match-info" style="
           display:none;
           font-size:70px;
           font-weight:bold;
           margin-bottom:20px;
           color:#2563eb;
         ">
            </div>

            <button id="start-btn" class="start-btn">
              开始答题
            </button>

          </div>

          <!-- 真正答题区域 -->
          <div id="question-container" style="display:none;">

            <!-- 当前队伍 -->
            <div class="team-info" id="team-info"></div>

            <!-- 计时器 -->
            <div class="timer" id="timer">
              剩余时间：30 秒
            </div>

            <!-- 题目 -->
            <div class="question-text" id="question-text"></div>

            <!-- 选项 -->
            <div class="options-container" id="options-container"></div>

            <!-- 抢答队伍 -->
            <div class="team-selector" id="team-selector"></div>

            <!-- 风险题分值 -->
            <div class="risk-selector" id="risk-selector"></div>

            <!-- 结果 -->
            <div class="result-area" id="result-area"></div>

            <!-- 按钮组 -->
            <div class="button-group">

              <!-- 普通题按钮 -->
              <button id="submit-btn">
                提交答案
              </button>

              <!-- 风险题按钮 -->
              <button id="end-answer-btn" style="display:none;">
                结束作答
              </button>

              <button id="correct-btn" style="display:none;">
                回答正确
              </button>

              <button id="wrong-btn" style="display:none;">
                回答错误
              </button>

              <!-- 全模式统一下一题 -->
              <button id="next-btn">
                下一题
              </button>

            </div>

          </div>

        </div>

      </div>

    </section>

    <!-- 积分榜 -->
    <aside class="scoreboard">

      <h3>实时积分榜</h3>

      <div id="scoreboard-list"></div>

      <button onclick="switchMode('home')" class="home-btn">
        返回主界面
      </button>

    </aside>

  </main>

  <!-- JS -->
  <script type="module" src="js/main.js"></script>

</body>

</html>
