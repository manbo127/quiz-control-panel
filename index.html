<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识竞赛赛事控制台</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="stylesheet" href="css/scoreboard.css">
  <link rel="stylesheet" href="css/buttons.css">
</head>

<body>

  <header class="topbar">
    <h1>知识竞赛赛事控制台</h1>

    <nav>
      <button onclick="switchMode('home')">首页</button>
      <button onclick="switchMode('answer')">必答题</button>
      <button onclick="switchMode('buzzer')">抢答题</button>
      <button onclick="switchMode('risk')">风险题</button>
    </nav>
  </header>

  <main class="main-layout">

    <section class="content-area">

      <!-- 首页内容 -->
      <div id="home-page" class="page active">
        <h2>欢迎进入知识竞赛系统</h2>
        <p>请选择比赛模式。</p>
      </div>

      <!-- 答题页面 -->
      <div id="question-page" class="page">

        <div class="mode-title" id="mode-title">必答题</div>

        <div class="question-card">

          <!-- 开始答题按钮 -->
          <div id="start-container">
            <button id="start-btn" class="start-btn">开始答题</button>
          </div>

          <!-- 答题区域，初始隐藏 -->
          <div id="question-container" style="display:none;">

            <!-- 当前队伍 -->
            <div class="team-info" id="team-info"></div>

            <!-- 题目 -->
            <div class="question-text" id="question-text"></div>

            <!-- 选项 -->
            <div class="options-container" id="options-container"></div>

            <!-- 抢答队伍选择 -->
            <div class="team-selector" id="team-selector"></div>

            <!-- 风险分值选择 -->
            <div class="risk-selector" id="risk-selector"></div>

            <!-- 结果显示 -->
            <div class="result-area" id="result-area"></div>

            <!-- 提交和下一题按钮 -->
            <div class="button-group">
              <button id="submit-btn">提交答案</button>
              <button id="next-btn">下一题</button>
            </div>

          </div>

        </div>

      </div>

    </section>

    <aside class="scoreboard">
      <h3>实时积分榜</h3>
      <div id="scoreboard-list"></div>
      <button onclick="switchMode('home')" class="home-btn">返回主界面</button>
    </aside>

  </main>

  <script type="module" src="js/main.js"></script>

</body>

</html>
